[package]
name = "timbre"
version = "0.1.0"
description = "Voice chain for the Fifine AM8 microphone"
edition = "2021"

[lib]
name = "timbre_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arc-swap = "1.9.3"
cpal = "0.18.2"
ringbuf = "0.5.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.7.2"
timbre-dsp = { path = "../crates/timbre-dsp" }
